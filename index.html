<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Sanfte Wachroutine für das iPhone – als Ergänzung zur zuverlässigen iPhone-Uhr.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WakeUp">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>WakeUp – Sanft wach werden</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1220; --panel:#151f32; --panel2:#1b2940; --border:#2b3950; --text:#f2f5fb; --muted:#aab9cc; --gold:#efc88e; --green:#a8e1c2; --blue:#9fc5f4; }
    * { box-sizing:border-box; } body { margin:0; min-height:100svh; background:radial-gradient(ellipse 90% 38% at 85% -5%, #253656 0%, transparent 80%),var(--bg); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); }
    button,input,select{font:inherit} button{cursor:pointer} a{color:var(--blue)} .app{max-width:560px;min-height:100svh;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 19px calc(110px + env(safe-area-inset-bottom));}
    .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.logo{font-weight:750;letter-spacing:.06em;font-size:18px}.logo i{display:inline-block;width:12px;height:12px;margin-right:9px;background:var(--gold);border-radius:50%;box-shadow:0 0 22px #efc88e99}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:650}.date{font-size:13px;color:var(--muted)}
    h1{font-size:32px;letter-spacing:-.035em;line-height:1.14;margin:8px 0 10px}h2{font-size:20px;letter-spacing:-.025em;margin:0 0 10px}h3{font-size:16px;margin:0 0 7px}p{margin:0 0 13px;color:var(--muted)}.subtitle{font-size:14px;max-width:36ch}.panel{background:linear-gradient(135deg,#1d2b44,#141e30);border:1px solid #344157;border-radius:23px;padding:22px;margin:18px 0;box-shadow:0 16px 60px #02061140}.hero{text-align:center;padding:28px 20px;background:radial-gradient(circle at 50% 15%,#34405d80,transparent 60%),linear-gradient(150deg,#222f49,#121c2b)}.sun{display:grid;place-items:center;margin:2px auto 18px;width:66px;height:66px;border-radius:50%;font-size:30px;color:#282c3a;background:linear-gradient(140deg,#fee0b8,#e6ac77);box-shadow:0 0 44px #f1c18437}.clock{font-variant-numeric:tabular-nums;font-size:66px;letter-spacing:-.055em;font-weight:720;line-height:1.2}.hint{font-size:13px;color:var(--muted)}.rule{height:1px;background:var(--border);margin:16px 0}.tiny{font-size:12px;color:var(--muted)}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid #546254;background:#283d36;color:var(--green);border-radius:100px;padding:5px 11px;font-size:12px;margin-top:12px}
    .button{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:15px 18px;border:0;border-radius:15px;font-weight:730;min-height:52px;text-align:center;transition:transform .1s}.button:active{transform:scale(.985)}.primary{background:linear-gradient(95deg,#f5d8ac,#deb282);color:#232132}.secondary{background:#26344b;color:#f4f7fc;border:1px solid #45546b}.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.flex>.button{width:auto;flex:1}.stack{display:grid;gap:10px}.alert{padding:14px 16px;background:#352e29;border:1px solid #6d5640;border-radius:14px;font-size:13px;color:#ecd3ad;margin:16px 0}.note{font-size:13px;color:var(--muted)}.step{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--border)}.step-num{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#2c3c56;color:var(--gold);font-size:13px;font-weight:750}.step strong{display:block;font-size:14px}.step span{font-size:13px;color:var(--muted)}
    .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:12;background:#0d1626ed;backdrop-filter:blur(15px);border-top:1px solid #2b3950;display:flex;justify-content:center;padding:11px 12px calc(13px + env(safe-area-inset-bottom));}.tabbar-inner{width:min(560px,100%);display:flex;gap:7px}.tab{flex:1;background:transparent;border:0;border-radius:12px;padding:9px 4px;color:#a2b4cb;font-size:12px;display:grid;gap:3px;justify-items:center}.tab.active{background:#26354b;color:#ffe0b7}.tab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
    label{display:block;color:#e6ecf4;font-size:13px;margin:16px 0 6px;font-weight:650}input,select{width:100%;height:50px;padding:10px 13px;color:var(--text);background:#202d43;border:1px solid #45536b;border-radius:12px}input[type="checkbox"]{width:20px;height:20px;accent-color:#e8be8c}.check{display:flex;gap:12px;align-items:center;background:#1e2b42;border-radius:14px;padding:12px;margin:10px 0;font-size:14px}.check input{flex:0 0 auto}.status{font-size:13px;color:var(--green)}.danger{color:#f1c1b5}.progress{height:9px;background:#2b3950;border-radius:12px;overflow:hidden;margin:20px 0}.fill{height:100%;background:linear-gradient(90deg,#cba26f,#e9d2b0);border-radius:12px;transition:width .4s}.countdown{font-size:50px;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.045em}.center{text-align:center}.success{color:var(--green)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px;border-radius:16px;background:#1e2b41;border:1px solid #344056}.stat b{display:block;font-size:25px;font-variant-numeric:tabular-nums}.stat small{color:var(--muted)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app"><div class="brand"><span class="logo"><i></i>WAKEUP</span><span class="date" id="today"></span></div><main id="screen"></main></div>
<nav class="tabbar" aria-label="Hauptnavigation"><div class="tabbar-inner"><button type="button" class="tab active" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V20H3z"/><path d="M9 20v-6h6v6"/></svg>Heute</button><button type="button" class="tab" data-tab="routine"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Wachroutine</button><button type="button" class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#0d1626"/><circle cx="16" cy="17" r="3" fill="#0d1626"/></svg>Einstellungen</button><button type="button" class="tab" data-tab="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>Einrichten</button></div></nav>
<script>
(()=>{'use strict';
const KEY='wakeup-hybrid-v1';
const defaults={time:'07:00',voice:'Guten Morgen. Zeit, in Ruhe aufzustehen.',check:2,tone:'soft',sound:true,clock:false,backups:false,automation:false,history:[],session:null};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...defaults}}
let tab='home', audioCtx=null, lastChimeStage='', toastTimer=0;
const $=sel=>document.querySelector(sel);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>localStorage.setItem(KEY,JSON.stringify(data));
const nowDay=()=>new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const labelTime=t=> /^\d\d:\d\d$/.test(t)?t:'07:00';
const elapsed=()=>data.session?Math.max(0,Date.now()-data.session.started):0;
const fmtMs=ms=>`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;
const svgSound='<span aria-hidden="true">♪</span>';
function chime(){if(!data.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let start=audioCtx.currentTime+.03;const notes=data.tone==='warm'?[392,440,523]:data.tone==='bright'?[523,659,784]:[330,392,494];notes.forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=start+i*.29;osc.type='sine';osc.frequency.setValueAtTime(hz,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.09,t+.035);gain.gain.exponentialRampToValueAtTime(.0001,t+.48);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.49)})}catch(e){console.warn('Audio unavailable',e)}}
function speak(){try{if(!('speechSynthesis'in window))return alert('Sprachansagen werden auf diesem Gerät nicht unterstützt.');speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(data.voice);utter.lang='de-DE';utter.rate=.88;utter.volume=.8;speechSynthesis.speak(utter)}catch{}}
function render(){ $('#today').textContent=nowDay();document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));const el=$('#screen');if(tab==='home')el.innerHTML=home();if(tab==='routine')el.innerHTML=routine();if(tab==='settings')el.innerHTML=settings();if(tab==='setup')el.innerHTML=setup();updateDynamic()}
function home(){const confirmed=data.history.filter(x=>x.done).length;const checks=[data.clock,data.backups,data.automation].filter(Boolean).length;return `<div class="eyebrow">Dein Morgen · ohne Stress</div><h1>Guten Morgen beginnt am Abend.</h1><p class="subtitle">Sanft wach werden – mit dem iPhone-Wecker als zuverlässiger Basis.</p><section class="panel hero"><div class="sun" aria-hidden="true">☀</div><div class="eyebrow">Deine geplante Weckzeit</div><div class="clock">${esc(labelTime(data.time))}</div><p class="hint">Die Zeit ist eine Erinnerung. Den wirklichen Alarm stellst du in der iPhone-Uhr ein.</p><span class="pill">● Offline nutzbar</span></section><button class="button primary" data-action="start">Wachroutine jetzt starten <span aria-hidden="true">→</span></button><div class="alert"><strong>Wichtig:</strong> Diese PWA klingelt nicht zuverlässig im Hintergrund. Der eigentliche Alarm muss in der iPhone-Uhr eingestellt sein.</div><section class="panel"><div class="flex"><h2>Deine Sicherheit</h2><span class="status">${checks}/3 vorbereitet</span></div><div class="step"><div class="step-num">1</div><div><strong>iPhone-Wecker</strong><span>${data.clock?'Als eingerichtet markiert':'Noch nicht als eingerichtet markiert'}</span></div></div><div class="step"><div class="step-num">2</div><div><strong>Zwei unabhängige Folgealarme</strong><span>${data.backups?'Als eingerichtet markiert':'Empfohlen: +5 und +10 Minuten'}</span></div></div><div class="step"><div class="step-num">3</div><div><strong>Kurzbefehle-Automation</strong><span>${data.automation?'Als eingerichtet markiert':'Bei „Gestoppt“ oder „Schlummern“ erinnern'}</span></div></div><button class="button secondary" data-tab="setup">Einrichtung ansehen</button></section><section class="stats"><div class="stat"><b>${confirmed}</b><small>Abgeschlossene Routinen</small></div><div class="stat"><b>${data.check} Min.</b><small>Wachkontrolle</small></div></section>`}
function routine(){const s=data.session;if(!s)return `<div class="eyebrow">Wachroutine</div><h1>Erst wach werden. Dann in den Tag.</h1><p>Hier beginnt deine persönliche Aufstehbegleitung, nachdem dein iPhone-Wecker geklingelt hat.</p><section class="panel center"><div class="sun">☀</div><h2>Sanfter Start</h2><p>Aufrichten, ins Licht gehen, Wasser trinken und kurz bestätigen, dass du wach bist. Keine Rätsel, kein QR-Code.</p><button class="button primary" data-action="start">Routine starten</button></section><button class="button secondary" data-action="sound">${svgSound} Weckklang testen</button>`;
if(s.stage===0)return `<div class="eyebrow">Schritt 1 von 3</div><h1>Du bist aufgewacht.</h1><p>Kein Stress. Setz dich aufrecht hin und atme einmal ruhig durch.</p><section class="panel center"><div class="sun">☀</div><div class="progress"><div class="fill" style="width:20%"></div></div><h2>Aufrichten</h2><p>Jetzt ist nur ein kleiner Schritt nötig.</p><button class="button primary" data-action="next">Ich sitze aufrecht</button></section><button class="button ghost" data-action="speak">Freundliche Ansage abspielen</button>`;
if(s.stage===1)return `<div class="eyebrow">Schritt 2 von 3</div><h1>Ein bisschen Bewegung.</h1><p>Steh auf, mach Licht an oder öffne die Vorhänge. Trink ein paar Schlucke Wasser.</p><section class="panel center"><div class="sun">✦</div><div class="progress"><div class="fill" style="width:60%"></div></div><h2>Aufstehen statt Schlummern</h2><p>Du brauchst keinen QR-Code. Bestätige den nächsten Schritt selbst.</p><button class="button primary" data-action="next">Ich bin aufgestanden</button></section><button class="button ghost" data-action="speak">Freundliche Ansage abspielen</button>`;
const due=s.due||Date.now();const isDue=Date.now()>=due;return `<div class="eyebrow">Schritt 3 von 3</div><h1>${isDue?'Noch wach?':'Bleib kurz in Bewegung.'}</h1><p>${isDue?'Deine Wachkontrolle ist jetzt dran.':'Die App fragt dich nach einer kurzen Pause erneut, ob du wirklich wach bist.'}</p><section class="panel center"><div class="sun">${isDue?'✓':'☀'}</div><div class="progress"><div class="fill" style="width:${isDue?100:78}%"></div></div><div class="countdown" id="remaining">${isDue?'Bereit':fmtMs(due-Date.now())}</div><p id="checkText">${isDue?'Bestätige jetzt, dass du noch wach bist.':'Diese Kontrolle funktioniert nur, solange die PWA aktiv ist.'}</p><button class="button primary" id="finishBtn" data-action="finish" ${isDue?'':'disabled style="opacity:.55"'}>Ja, ich bin wach</button></section><p class="note">Wenn du die App schließt, kann sie dich nicht zuverlässig erneut wecken. Deshalb sind die zusätzlichen iPhone-Alarme wichtig.</p>`}
function settings(){return `<div class="eyebrow">Deine Einstellungen</div><h1>So wacht es sich besser auf.</h1><p>Diese Einstellungen steuern die PWA-Routine, nicht die iPhone-Uhr.</p><section class="panel"><label for="time">Geplante Weckzeit</label><input id="time" type="time" value="${esc(labelTime(data.time))}"><label for="check">Wachkontrolle nach</label><select id="check"><option value="2" ${data.check===2?'selected':''}>2 Minuten</option><option value="3" ${data.check===3?'selected':''}>3 Minuten</option><option value="5" ${data.check===5?'selected':''}>5 Minuten</option></select><label for="tone">Klang der Wachroutine</label><select id="tone"><option value="soft" ${data.tone==='soft'?'selected':''}>Sanft</option><option value="warm" ${data.tone==='warm'?'selected':''}>Warm</option><option value="bright" ${data.tone==='bright'?'selected':''}>Klar</option></select><label class="check"><input type="checkbox" id="sound" ${data.sound?'checked':''}>Angenehme Signale während der geöffneten App</label><label for="voice">Persönliche Ansage</label><input id="voice" maxlength="180" value="${esc(data.voice)}"><p class="tiny">Die Sprachansage wird nur auf Knopfdruck abgespielt, solange die App geöffnet ist.</p><div class="stack"><button class="button primary" data-action="save">Einstellungen speichern</button><button class="button secondary" data-action="sound">${svgSound} Klang testen</button><button class="button secondary" data-action="speak">Ansage testen</button></div></section><div class="alert">Änderungen an der Weckzeit musst du zusätzlich in der iPhone-Uhr übernehmen. Eine Webseite darf keine echten iOS-Systemalarme anlegen.</div>`}
function setup(){return `<div class="eyebrow">Einmalige Einrichtung</div><h1>Damit du zuverlässig geweckt wirst.</h1><p>Alles direkt auf dem iPhone, kostenlos und ohne Computer.</p><section class="panel"><h2>1. iPhone-Uhr</h2><p>Öffne die App <strong>Uhr</strong> → <strong>Wecker</strong> und richte ${esc(labelTime(data.time))} als Hauptalarm ein. Wähle einen angenehmen, deutlich hörbaren Ton.</p><label class="check"><input type="checkbox" data-flag="clock" ${data.clock?'checked':''}>Hauptalarm in der Uhr eingerichtet</label><h2>2. Sicherheitsalarme</h2><p>Lege in der Uhr zwei <strong>eigenständige</strong> Alarme an, z. B. 5 und 10 Minuten nach dem Hauptalarm. So bist du nicht auf die PWA oder die Schlummerfunktion angewiesen.</p><label class="check"><input type="checkbox" data-flag="backups" ${data.backups?'checked':''}>Beide Folgealarme eingerichtet</label><h2>3. Apple Kurzbefehle</h2><p>Öffne <strong>Kurzbefehle → Automation → + → Wecker</strong>. Wähle <strong>Wird gestoppt</strong> für den Hauptalarm und stelle – soweit angeboten – <strong>Sofort ausführen</strong> ein. Füge z. B. <strong>Mitteilung anzeigen</strong> hinzu: „Jetzt WakeUp öffnen und aufstehen“. Eine zweite Automation kann auf <strong>Wird geschlummert</strong> reagieren.</p><p class="tiny">Das automatische Öffnen einer Webseite bei gesperrtem iPhone ist nicht garantiert. Die Automation ist nur eine Ergänzung.</p><label class="check"><input type="checkbox" data-flag="automation" ${data.automation?'checked':''}>Automation eingerichtet</label><h2>4. Zum Home-Bildschirm</h2><p>Öffne die veröffentlichte GitHub-Pages-Adresse in Safari → Teilen → <strong>Zum Home-Bildschirm</strong>. Anschließend funktioniert die App nach dem ersten Online-Aufruf auch offline.</p></section><button class="button secondary" data-tab="home">Zur Übersicht</button><p class="tiny">Diese Häkchen dokumentieren nur deine eigene Einrichtung. WakeUp kann den Status der iPhone-Uhr nicht auslesen.</p>`}
function updateDynamic(){if(tab!=='routine'||!data.session||data.session.stage!==2)return;const due=data.session.due;const left=Math.max(0,due-Date.now());const rem=$('#remaining'),finish=$('#finishBtn'),txt=$('#checkText');if(rem)rem.textContent=left?' '+fmtMs(left):'Bereit';if(finish){finish.disabled=!!left;finish.style.opacity=left?'.55':'1'}if(txt&&!left)txt.textContent='Bestätige jetzt, dass du noch wach bist.';if(!left&&lastChimeStage!==String(due)){lastChimeStage=String(due);chime()}}
function handle(action){if(action==='start'){data.session={started:Date.now(),stage:0};persist();tab='routine';render();return}if(action==='next'&&data.session){if(data.session.stage===0)data.session.stage=1;else if(data.session.stage===1){data.session.stage=2;data.session.due=Date.now()+data.check*60000}persist();render();return}if(action==='finish'&&data.session&&data.session.stage===2&&Date.now()>=data.session.due){data.history=[...data.history,{at:new Date().toISOString(),done:true,duration:Math.round(elapsed()/1000)}].slice(-90);data.session=null;persist();tab='home';render();alert('Geschafft. Deine Wachroutine ist abgeschlossen.');return}if(action==='save'){const time=$('#time').value;data.time=labelTime(time);data.check=Number($('#check').value);data.tone=$('#tone').value;data.voice=$('#voice').value.trim()||defaults.voice;data.sound=$('#sound').checked;persist();render();alert('Einstellungen gespeichert. Den Alarm bitte auch in der iPhone-Uhr anpassen.');return}if(action==='sound'){chime();return}if(action==='speak'){speak();return}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-tab]');if(!btn)return;if(btn.dataset.tab){tab=btn.dataset.tab;render();scrollTo({top:0,behavior:'smooth'})}else handle(btn.dataset.action)});
document.addEventListener('change',e=>{const flag=e.target.dataset.flag;if(flag&&['clock','backups','automation'].includes(flag)){data[flag]=e.target.checked;persist()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateDynamic()});
setInterval(updateDynamic,1000);render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
